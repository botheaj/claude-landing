<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJ's Claude Projects</title>
<meta name="description" content="Everything AJ Bothe has built with Claude, in one place.">
<style>
  :root {
    --bg: #f7f3ee; --card: #fffdfa; --ink: #2b2620; --muted: #776d62;
    --line: #e6ddd2; --accent: #c96442;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17; --card: #262320; --ink: #eee7de; --muted: #a39887;
      --line: #3a352f; --accent: #e08a68;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px 64px; }
  header { text-align: center; margin-bottom: 36px; }
  h1 { font: 600 1.9rem/1.2 ui-serif, Georgia, serif; margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); }
  h2 {
    font-size: .75rem; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); margin: 32px 0 10px;
  }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 10px;
    transition: border-color .15s, transform .15s;
  }
  a.card:hover, a.card:focus-visible { border-color: var(--accent); transform: translateY(-1px); outline: none; }
  .name { font-weight: 600; }
  .host { color: var(--accent); font-size: .85rem; }
  .desc { color: var(--muted); font-size: .92rem; margin-top: 2px; }
  footer { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 40px; }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header>
    <h1>AJ's Claude Projects</h1>
    <p>Things I've built with Claude.</p>
  </header>
  <div id="list"><noscript>This page needs JavaScript to list the projects.</noscript></div>
  <footer><a href="https://ajbothe.com">ajbothe.com</a></footer>
</main>
<script>
  // Projects live in projects.json so a deploy can add one without touching markup.
  // Groups render in the order they first appear in the file.
  fetch('projects.json')
    .then(r => r.json())
    .then(projects => {
      const groups = new Map();
      for (const p of projects) {
        if (!groups.has(p.group)) groups.set(p.group, []);
        groups.get(p.group).push(p);
      }
      const list = document.getElementById('list');
      for (const [group, items] of groups) {
        const h = document.createElement('h2');
        h.textContent = group;
        list.append(h);
        for (const p of items) {
          const a = document.createElement('a');
          a.className = 'card';
          a.href = p.url;
          const name = document.createElement('div');
          name.className = 'name';
          name.textContent = p.name;
          const host = document.createElement('div');
          host.className = 'host';
          host.textContent = new URL(p.url).host;
          const desc = document.createElement('div');
          desc.className = 'desc';
          desc.textContent = p.description || '';
          a.append(name, host, desc);
          list.append(a);
        }
      }
    });
</script>
</body>
</html>
